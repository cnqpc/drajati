    <style>
        body { 
            font-family: 'Cairo', system-ui, -apple-system, sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn-tap { transition: transform 0.15s ease, opacity 0.15s ease; }
        .btn-tap:active { transform: scale(0.92); }
        
        /* تأثيرات الحركة والتفاعل */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-10deg); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(15deg); }
            60% { transform: rotate(-15deg); }
        }
        .animate-swing { animation: swing 0.4s ease-in-out; }

        /* حركية خاصة وأنيقة لأيقونة الإعدادات عند النقر */
        @keyframes gearSpinPulse {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.25); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .settings-gear-anim { animation: gearSpinPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* كبسولات التفاعل */
        .interaction-capsule {
            transition: all 0.2s ease;
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = "https://lurzvtbvsglxswoiftao.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_DDnpGIIa1_yMCTGPZjhQJA_oMg48DGt"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // إنشاء أو جلب هوية المستخدم
        let CURRENT_USER_ID = localStorage.getItem('my_app_user_id');
        if (!CURRENT_USER_ID) {
            CURRENT_USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('my_app_user_id', CURRENT_USER_ID);
        }

        let compressedImagesBase64 = [];
        let currentCategoryFilter = 'الكل';
        let allPostsData = [];
        let savedPostsSet = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-id-display').innerText = CURRENT_USER_ID;
            
            // تهيئة حالة الدارك مود المسجلة سابقاً

        // تأثيرات الصوت
        function playAudioEffect(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'like') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'comment') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'save') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, ctx.currentTime);
                    osc.frequency.setValueAtTime(650, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.18);
                }
            } catch(e) {}
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function toggleMenu(menuId) {
            document.querySelectorAll('[id^="menu-"]').forEach(el => {
                if(el.id !== menuId) el.classList.add('hidden');
            });
            const menu = document.getElementById(menuId);
            if(menu) menu.classList.toggle('hidden');
        }

        // فتح واجهة الإعدادات مع تشغيل الحركة المميزة للترس
        function openSettingsModal() {
            const gearIcon = document.getElementById('settings-icon');
            gearIcon.classList.add('settings-gear-anim');
            setTimeout(() => {
                gearIcon.classList.remove('settings-gear-anim');
            }, 600);

            toggleModal('settings-modal');
        }

        // تحويل الوضع الداكن (Dark Mode)
        function toggleDarkMode() {
            const isDark = document.getElementById('dark-mode-toggle').checked;
            if (isDark) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }

        // تواصل معنا المباشر إلى الجيميل
        function contactUsMail() {
            const myEmail = "1212OPOZZZ@gmail.com";
            const subject = encodeURIComponent("استفسار / تواصل من تطبيق دراجتي");
            const body = encodeURIComponent("مرحباً، أود التواصل معكم بشأن:");
            window.location.href = `mailto:${myEmail}?subject=${subject}&body=${body}`;
        }

        function showProfileView() {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
        }

        function showMainView() {
            document.getElementById('profile-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');

        function selectCategory(cat) {
            currentCategoryFilter = cat;
            document.getElementById('selected-category-label').innerText = cat;
            toggleModal('categories-modal');
            renderPosts(allPostsData);

        // جلب الإعلانات من قاعدة البيانات
        async function loadPostsFromSupabase() {
            const { data: posts, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('posts-container').innerHTML = `<div class="text-center py-6 text-red-500 text-xs font-bold">خطأ في التحميل: ${error.message}</div>`;
                return;
            }

            allPostsData = posts || [];
            renderPosts(allPostsData);
        }

        async function fetchSavedPostsIds() {
            const { data } = await supabaseClient
                .from('saved_posts')
                .select('post_id')
                .eq('user_id', CURRENT_USER_ID);
            
            if(data) {
                savedPostsSet = new Set(data.map(item => item.post_id));
            }
        }

        // عرض المنشورات وتحديد صاحب المنشور لظهور زر الحذف
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            
            let filtered = posts;
            if (currentCategoryFilter !== 'الكل') {
                filtered = posts.filter(p => p.category === currentCategoryFilter);
            }

            const searchVal = document.getElementById('search-input')?.value.toLowerCase();
            if (searchVal) {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(searchVal) || p.description?.toLowerCase().includes(searchVal));
            }

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">لا توجد منشورات حالياً</div>`;
                return;
            }

            container.innerHTML = filtered.map(post => {
                const isOwner = post.user_id === CURRENT_USER_ID;
                const likesList = post.likes_users || [];
                const isLiked = likesList.includes(CURRENT_USER_ID);
                const isSaved = savedPostsSet.has(post.id);

                return `
                <div class="bg-white dark:bg-gray-800 mb-4 shadow-sm border-y sm:border sm:rounded-xl overflow-hidden border-gray-200 dark:border-gray-700">
                    <!-- الهيدر العلوي للمنشور (اسم الناشر والخيارات) -->
                    <div class="p-3 flex justify-between items-center relative">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow">
                                <i class="fa-solid fa-motorcycle"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-xs text-gray-900 dark:text-gray-100 leading-tight">${post.title}</h4>
                                <div class="flex items-center gap-2 text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">
                                    <span class="text-blue-600 dark:text-blue-400 font-semibold">${post.city}</span>
                                    <span>•</span>
                                    <span>${post.category}</span>
                                </div>
                            </div>
                        </div>

                        <!-- الثلاث نقاط في أعلى المنشور على اليسار -->
                        <div class="relative">
                            <button onclick="toggleMenu('menu-${post.id}')" class="w-8 h-8 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 btn-tap">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </button>

                            <!-- قائمة النقاط الثلاث -->
                            <div id="menu-${post.id}" class="hidden absolute left-0 top-9 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 shadow-xl rounded-xl py-1 w-32 z-30 text-xs">
                                ${isOwner ? `
                                    <button onclick="deletePost(${post.id})" class="w-full px-3 py-2 text-right text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 font-bold flex items-center gap-2">
                                        <i class="fa-regular fa-trash-can"></i> حذف
                                    </button>
                                ` : `
                                    <button onclick="reportPost(${post.id}, '${post.title}')" class="w-full px-3 py-2 text-right text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/20 font-bold flex items-center gap-2">
                                        <i class="fa-regular fa-flag"></i> إبلاغ
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>

                    <!-- التفاصيل والسعر -->
                    <div class="px-3 pb-2 text-xs text-gray-700 dark:text-gray-300 space-y-1">
                        <p class="font-black text-emerald-600 dark:text-emerald-400 text-sm">${post.price}</p>
                        <p class="leading-relaxed">${post.description || ''}</p>
                    </div>

                    <!-- الصورة بجودة عالية ونقية جداً مع مقاس مربع -->
                    ${(post.images && post.images[0]) ? `
                        <div class="w-full aspect-square bg-gray-900 overflow-hidden flex items-center justify-center">
                            <img src="${post.images[0]}" class="w-full h-full object-contain bg-black/40">
                        </div>
                    ` : ''}

                    <!-- أزرار التفاعل داخل الكبسولات -->
                    <div class="p-2.5 flex items-center justify-between border-t border-gray-100 dark:border-gray-700 text-xs">
                        <div class="flex items-center gap-1.5">
                            <!-- كبسولة الإعجاب -->
                            <button onclick="handleLike(${post.id}, this)" class="interaction-capsule bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full flex items-center gap-1.5 btn-tap font-bold ${isLiked ? 'text-red-500 bg-red-50 dark:bg-red-950/40' : 'text-gray-600 dark:text-gray-300'}">
                                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart icon-heart text-sm"></i>
                                <span class="like-count">${post.likes_count || 0}</span>
                            </button>

                            <!-- كبسولة التعليقات -->
                            <button onclick="openCommentsModal(${post.id}, this)" class="interaction-capsule bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full flex items-center gap-1.5 text-gray-600 dark:text-gray-300 btn-tap font-bold">
                                <i class="fa-regular fa-comment icon-comment text-sm"></i>
                                <span>تعليق</span>
                            </button>

                            <!-- كبسولة المشاركة -->
                            <button onclick="sharePost('${post.title}', ${post.id})" class="interaction-capsule bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full flex items-center gap-1.5 text-gray-600 dark:text-gray-300 btn-tap font-bold">
                                <i class="fa-solid fa-share-nodes text-sm"></i>
                                <span>مشاركة</span>
                            </button>
                        </div>

                        <!-- كبسولة الحفظ بعيدة جهة اليسار -->
                        <button onclick="toggleSavePost(${post.id}, this)" class="interaction-capsule bg-gray-100 dark:bg-gray-700 p-2 rounded-full text-gray-600 dark:text-gray-300 btn-tap ${isSaved ? 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/40' : ''}" title="حفظ المنشور">
                            <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark icon-bookmark text-sm"></i>
                        </button>
                    </div>

                    <!-- خط رمادي فاتح فاصل بين المنشورات -->
                    <div class="h-2 bg-gray-200/70 dark:bg-gray-900 w-full"></div>
                </div>
                `;
            }).join('');
        }

        // فتح النافذة المنبثقة القافزة للمحفوظات
        async function openSavedPostsModal() {
            playAudioEffect('save');
            toggleModal('saved-modal');
            const listEl = document.getElementById('saved-modal-list');
            listEl.innerHTML = `<p class="text-center text-gray-400 py-4">جاري تحميل المحفوظات...</p>`;

            const { data, error } = await supabaseClient
                .from('saved_posts')
                .select('post_id, posts(*)')
                .eq('user_id', CURRENT_USER_ID);

            if (error || !data || data.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-400 py-6">لا توجد إعلانات محفوظة لديك حالياً.</p>`;
                return;
            }

            const savedPosts = data.map(d => d.posts).filter(Boolean);
            
            listEl.innerHTML = savedPosts.map(post => `
                <div class="bg-gray-50 dark:bg-gray-700/60 p-2.5 rounded-xl border dark:border-gray-600 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <img src="${(post.images && post.images[0]) ? post.images[0] : 'https://via.placeholder.com/80'}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0 border dark:border-gray-600">
                        <div class="truncate">
                            <h4 class="font-bold text-xs text-gray-800 dark:text-gray-100 truncate">${post.title}</h4>
                            <p class="text-[10px] text-gray-500 dark:text-gray-400">الناشر: <span class="font-semibold text-blue-600 dark:text-blue-400">${post.city}</span></p>
                            <p class="text-[11px] font-black text-emerald-600 dark:text-emerald-400">${post.price}</p>
                        </div>
                    </div>
                    <a href="https://wa.me/${post.phone}" target="_blank" class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 flex-shrink-0 btn-tap">
                        <i class="fa-brands fa-whatsapp"></i> تواصل
                    </a>
                </div>
            `).join('');
        }

        // تفاعلات الأعجابات
        async function handleLike(postId, btnEl) {
            playAudioEffect('like');
            const icon = btnEl.querySelector('.icon-heart');
            const countEl = btnEl.querySelector('.like-count');
            
            icon.classList.add('animate-pop');
            setTimeout(() => icon.classList.remove('animate-pop'), 400);

            const post = allPostsData.find(p => p.id === postId);
            if(!post) return;

            let likesList = post.likes_users || [];
            let currentLikes = post.likes_count || 0;

            const userIndex = likesList.indexOf(CURRENT_USER_ID);
            if (userIndex === -1) {
                likesList.push(CURRENT_USER_ID);
                currentLikes += 1;
                btnEl.classList.add('text-red-500', 'bg-red-50', 'dark:bg-red-950/40');
                btnEl.classList.remove('text-gray-600', 'dark:text-gray-300');
                icon.classList.replace('fa-regular', 'fa-solid');
            } else {
                likesList.splice(userIndex, 1);
                currentLikes = Math.max(0, currentLikes - 1);
                btnEl.classList.remove('text-red-500', 'bg-red-50', 'dark:bg-red-950/40');
                btnEl.classList.add('text-gray-600', 'dark:text-gray-300');
                icon.classList.replace('fa-solid', 'fa-regular');
            }

            post.likes_count = currentLikes;
            post.likes_users = likesList;
            countEl.innerText = currentLikes;

            await supabaseClient.from('posts').update({
                likes_count: currentLikes,
                likes_users: likesList
            }).eq('id', postId);
        }

        // حفظ المنشور
        async function toggleSavePost(postId, btnEl) {
            playAudioEffect('save');
            const icon = btnEl.querySelector('.icon-bookmark');

            if (savedPostsSet.has(postId)) {
                savedPostsSet.delete(postId);
                btnEl.classList.remove('text-blue-600', 'dark:text-blue-400', 'bg-blue-50', 'dark:bg-blue-900/40');
                icon.classList.replace('fa-solid', 'fa-regular');

                await supabaseClient.from('saved_posts')
                    .delete()
                    .eq('user_id', CURRENT_USER_ID)
                    .eq('post_id', postId);
            } else {
                savedPostsSet.add(postId);
                btnEl.classList.add('text-blue-600', 'dark:text-blue-400', 'bg-blue-50', 'dark:bg-blue-900/40');
                icon.classList.replace('fa-regular', 'fa-solid');

                await supabaseClient.from('saved_posts').insert([{
                    user_id: CURRENT_USER_ID,
                    post_id: postId
                }]);
            }
        }

        // التعليقات
        async function openCommentsModal(postId, btnEl) {
            playAudioEffect('comment');
            const icon = btnEl.querySelector('.icon-comment');
            if(icon) {
                icon.classList.add('animate-swing');
                setTimeout(() => icon.classList.remove('animate-swing'), 400);
            }

            document.getElementById('active-post-id').value = postId;
            toggleModal('comments-modal');
            loadComments(postId);
        }

        async function loadComments(postId) {
            const listEl = document.getElementById('comments-list');
            listEl.innerHTML = `<p class="text-center text-gray-400">جاري التحميل...</p>`;

            const { data: comments } = await supabaseClient
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if(!comments || comments.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-400 py-4">لا توجد تعليقات بعد، كن الأول!</p>`;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="bg-gray-50 dark:bg-gray-700/50 p-2.5 rounded-xl border border-gray-100 dark:border-gray-600">
                    <p class="text-gray-800 dark:text-gray-200 font-medium">${c.text}</p>
                </div>
            `).join('');
        }

        async function handleAddComment(e) {
            e.preventDefault();
            const postId = document.getElementById('active-post-id').value;
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text) return;

            input.value = '';
            await supabaseClient.from('comments').insert([{ post_id: postId, text }]);
            loadComments(postId);
        }

        // حذف المنشور
        async function deletePost(postId) {
            if(!confirm("هل أنت تأكد من إزالة هذا المنشور؟")) return;
            
            await supabaseClient.from('posts').delete().eq('id', postId);
            allPostsData = allPostsData.filter(p => p.id !== postId);
            renderPosts(allPostsData);
        }

        // الإبلاغ المباشر
        function reportPost(postId, title) {
            const myEmail = "1212OPOZZZ@gmail.com";
            const subject = encodeURIComponent(`إبلاغ عن منشور برقم: ${postId}`);
            const body = encodeURIComponent(`مرحباً، أود الإبلاغ عن المنشور التالي: "${title}" (المعرف: ${postId}) بسبب مخالفته للشروط.`);
            
            window.location.href = `mailto:${myEmail}?subject=${subject}&body=${body}`;
        }

        // المشاركة
        function sharePost(title, id) {
            const shareUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `شاهد هذا الإعلان على دراجتي: ${title}`,
                    url: shareUrl,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("تم نسخ رابط المنشور بنجاح!");
            }
        }

        // معالجة الصور بدقة عالية ونقاء كامل ($1200 \times 1200$)
        async function previewAndCompressImages(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    // رفع الجودة والأبعاد لضمان الوضوح العالي للصورة
                    canvas.width = 1200;
                    canvas.height = 1200;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    ctx.drawImage(img, 0, 0, 1200, 1200);
                    compressedImagesBase64 = [canvas.toDataURL('image/jpeg', 0.92)];
                    
                    document.getElementById('images-preview').innerHTML = `<img src="${compressedImagesBase64[0]}" class="w-20 h-20 object-cover rounded-lg border dark:border-gray-600">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // إضافة منشور جديد
        async function handleCreatePost(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-post-btn');
            btn.disabled = true;
            btn.innerText = "جاري النشر...";

            const newPost = {
                user_id: CURRENT_USER_ID,
                title: document.getElementById('post-title').value,
                price: document.getElementById('post-price').value,
                category: document.getElementById('post-category').value,
                city: document.getElementById('post-city').value,
                phone: document.getElementById('post-phone').value,
                description: document.getElementById('post-desc').value,
                images: compressedImagesBase64,
                likes_count: 0,
                likes_users: []
            };

            const { error } = await supabaseClient.from('posts').insert([newPost]);
            
            if (error) {
                alert("حدث خطأ: " + error.message);
            } else {
                alert("تم نشر الإعلان بنجاح!");
                toggleModal('add-post-modal');
                document.getElementById('add-post-form').reset();
                document.getElementById('images-preview').innerHTML = '';
                compressedImagesBase64 = [];
                loadPostsFromSupabase();
            }

            btn.disabled = false;
            btn.innerText = "نشر الآن";
        }

        function filterPosts() {
            renderPosts(allPostsData);
        }
    </script>
</body>
</html>
