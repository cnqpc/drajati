<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراجتي - المنصة الأولى للدراجات في العراق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #FF5722;
            --primary-hover: #E64A19;
            --secondary: #212121;
            --bg: #F4F6F8;
            --surface: #FFFFFF;
            --text: #212121;
            --text-light: #757575;
            --border: #E0E0E0;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        body.dark-mode {
            --bg: #121212;
            --surface: #1E1E1E;
            --text: #E0E0E0;
            --text-light: #A0A0A0;
            --border: #333333;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

        .header { position: sticky; top: 0; background: var(--surface); box-shadow: var(--shadow); z-index: 1000; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo-container i { font-size: 24px; color: var(--primary); }
        .logo-container h1 { font-size: 20px; font-weight: 800; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .search-filter-section { padding: 16px; background: var(--surface); margin-bottom: 12px; box-shadow: var(--shadow); }
        .search-box input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }
        .filters-container { display: flex; gap: 8px; margin-top: 10px; }
        .filter-select { padding: 8px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); flex: 1; }

        .main-container { max-width: 800px; margin: 0 auto; padding: 0 16px; }
        .posts-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

        .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; }
        
        /* تعديل حاوية وعرض الصورة لتظهر كاملة وبدون قص أو ضبابية */
        .card-img-container { width: 100%; height: 300px; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: contain; }

        .card-body { padding: 12px; }
        .card-title { font-size: 16px; font-weight: bold; }
        .card-price { font-size: 18px; font-weight: 800; color: var(--primary); margin: 4px 0; }
        .card-desc { font-size: 13px; color: var(--text-light); margin-bottom: 10px; }

        .card-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 8px; }
        .action-btn { background: none; border: none; color: var(--text-light); cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .delete-btn { color: #d9534f; background: rgba(217, 83, 79, 0.1); border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .delete-btn:hover { background: rgba(217, 83, 79, 0.2); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 500px; padding: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>دراجتي</h1>
        </div>
        <button class="btn-add" onclick="openModal('addPostModal')"><i class="fa-solid fa-plus"></i> أضف إعلان</button>
    </header>

    <div class="search-filter-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن دراجة..." oninput="fetchPosts()">
        </div>
        <div class="filters-container">
            <select id="categoryFilter" class="filter-select" onchange="fetchPosts()">
                <option value="">جميع الفئات</option>
                <option value="نارية">دراجات نارية</option>
                <option value="هوائية">دراجات هوائية</option>
                <option value="شحن">دراجات شحن</option>
            </select>
            <select id="cityFilter" class="filter-select" onchange="fetchPosts()">
                <option value="">جميع المحافظات</option>
                <option value="بغداد">بغداد</option>
                <option value="البصرة">البصرة</option>
                <option value="النجف">النجف</option>
                <option value="كربلاء">كربلاء</option>
                <option value="أربيل">أربيل</option>
            </select>
        </div>
    </div>

    <div class="main-container">
        <div class="posts-grid" id="postsContainer">
            <p style="text-align: center; padding: 20px;">جاري تحميل الإعلانات من Supabase...</p>
        </div>
    </div>

    <!-- Modal Add Post -->
    <div class="modal" id="addPostModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <h3>إضافة إعلان جديد</h3>
                <button onclick="closeModal('addPostModal')" style="background:none; border:none; font-size:18px; cursor:pointer;">&times;</button>
            </div>
            <form id="addPostForm" onsubmit="handleAddPost(event)">
                <div class="form-group">
                    <label>عنوان الإعلان</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="postCategory">
                        <option value="نارية">دراجة نارية</option>
                        <option value="هوائية">دراجة هوائية</option>
                        <option value="شحن">دراجة شحن</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المحافظة</label>
                    <select id="postCity">
                        <option value="بغداد">بغداد</option>
                        <option value="البصرة">البصرة</option>
                        <option value="النجف">النجف</option>
                        <option value="كربلاء">كربلاء</option>
                        <option value="أربيل">أربيل</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر (د.ع)</label>
                    <input type="number" id="postPrice" required>
                </div>
                <div class="form-group">
                    <label>اختر صورة من الهاتف</label>
                    <input type="file" id="postImgFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="postDesc" required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">نشر الآن</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lurzvtbvsglxswoiftao.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DDnpGIIa1_yMCTGPZjhQJA_oMg48DGt";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = {
            name: "مستخدم دراجتي",
            avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=" + Math.random()
        };

        async function fetchPosts() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const city = document.getElementById('cityFilter').value;

            let query = db.from('posts').select('*').order('created_at', { ascending: false });

            if (category) query = query.eq('category', category);
            if (city) query = query.eq('city', city);
            if (search) query = query.ilike('title', `%${search}%`);

            const { data, error } + await query;
            if (error) console.error(error);
            else renderPosts(data || []);
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:center;">لا توجد إعلانات حالياً.</p>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="card">
                    <div class="card-header">
                        <div class="user-info">
                            <img src="${post.user_avatar}" class="user-avatar">
                            <div>
                                <h4>${post.user_name}</h4>
                                <span style="font-size:11px; color:gray;">${post.city}</span>
                            </div>
                        </div>
                        <span style="font-size:11px; background:#eee; padding:2px 8px; border-radius:4px;">${post.category}</span>
                    </div>
                    <div class="card-img-container">
                        <img src="${post.img_url}" alt="Post Image">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${post.title}</div>
                        <div class="card-price">${parseInt(post.price).toLocaleString()} د.ع</div>
                        <div class="card-desc">${post.description}</div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="toggleLike(${post.id}, ${post.likes})">
                                <i class="fa-regular fa-heart"></i> ${post.likes || 0}
                            </button>
                            <button class="delete-btn" onclick="deletePost(${post.id})">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function handleAddPost(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري رفع الصورة والإعلان...";

            try {
                const fileInput = document.getElementById('postImgFile');
                const file = fileInput.files[0];
                const fileName = `${Date.now()}_${file.name}`;

                const { data: imgData, error: imgError } = await db.storage
                    .from('post-images')
                    .upload(fileName, file);

                if (imgError) throw imgError;

                const { data: publicUrlData } = db.storage.from('post-images').getPublicUrl(fileName);
                const imgUrl = publicUrlData.publicUrl;

                const { error } = await db.from('posts').insert([{
                    user_name: currentUser.name,
                    user_avatar: currentUser.avatar,
                    title: document.getElementById('postTitle').value,
                    category: document.getElementById('postCategory').value,
                    city: document.getElementById('postCity').value,
                    price: parseFloat(document.getElementById('postPrice').value),
                    img_url: imgUrl,
                    description: document.getElementById('postDesc').value
                }]);

                if (error) throw error;

                closeModal('addPostModal');
                document.getElementById('addPostForm').reset();
                fetchPosts();
            } catch (err) {
                alert("حدث خطأ: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "نشر الآن";
            }
        }

        async function deletePost(id) {
            if (confirm("هل أنت متأكد من حذف هذا الإعلان؟")) {
                const { error } = await db.from('posts').delete().eq('id', id);
                if (error) {
                    alert("فشل الحذف: " + error.message);
                } else {
                    fetchPosts();
                }
            }
        }

        async function toggleLike(id, currentLikes) {
            await db.from('posts').update({ likes: (currentLikes || 0) + 1 }).eq('id', id);
            fetchPosts();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        db.channel('posts_channel').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
            fetchPosts();
        }).subscribe();

        fetchPosts();
    </script>
</body>
</html>
