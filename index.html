<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراجتي - سوق الدراجات الأول في العراق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f2f5; }
        .whatsapp-bg { background-color: #efeae2; }
        .btn-tap { transition: transform 0.1s ease; }
        .btn-tap:active { transform: scale(0.95); }
        .like-active { color: #1877f2 !important; font-weight: bold; }
    </style>
</head>
<body class="bg-[#f0f2f5] text-gray-800">

    <!-- 1. الهيدر العلوي -->
    <header class="bg-[#1877f2] text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="openProfile('علي العراقي', 'بغداد', 3, 1)">
                <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-lg">👤</div>
                <span class="font-bold text-lg tracking-wide">دراجتي</span>
            </div>
            
            <div class="flex items-center space-x-2 space-x-reverse">
                <button onclick="checkAuthAndAction(() => toggleModal('add-post-modal'))" class="bg-green-500 hover:bg-green-600 text-white px-3.5 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 shadow btn-tap">
                    <i class="fa-solid fa-plus"></i>
                    <span>إعلان جديد</span>
                </button>
                <button onclick="openProfile('حسابي الشخصي', 'بغداد', 0, 0)" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full text-xs font-bold btn-tap">
                    ملفي
                </button>
            </div>
        </div>
    </header>

    <!-- 2. الرئيسية وخلاصة الإعلانات -->
    <main class="max-w-2xl mx-auto pt-4 px-2 pb-16">
        <!-- شريط فلاتر المحافظات -->
        <div class="bg-white p-3 rounded-xl shadow mb-4">
            <div class="flex items-center gap-2 overflow-x-auto text-xs pb-1">
                <span class="font-bold text-gray-500 whitespace-nowrap">المحافظة:</span>
                <select class="bg-gray-100 border rounded-lg px-3 py-1.5 font-semibold text-gray-700 outline-none">
                    <option value="">كافة المحافظات</option>
                    <option>بغداد</option><option>البصرة</option><option>النجف</option>
                    <option>كربلاء</option><option>بابل</option><option>ميسان</option>
                    <option>ذي قار</option><option>الأنبار</option><option>ديالى</option>
                    <option>كركوك</option><option>صلاح الدين</option><option>المثنى</option><option>واسط</option>
                </select>
            </div>
        </div>

        <!-- منشور نموذجي متكامل -->
        <div class="bg-white rounded-xl shadow overflow-hidden border border-gray-200 mb-4">
            <div class="p-3 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="openProfile('علي العراقي', 'بغداد - الكرادة', 4, 2)">
                    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm">ع</div>
                    <div>
                        <h4 class="font-bold text-sm text-gray-900 hover:underline">علي العراقي</h4>
                        <p class="text-[11px] text-gray-500">بغداد • منذ ساعتين</p>
                    </div>
                </div>
                <span class="bg-blue-50 text-blue-600 text-xs px-2.5 py-1 rounded-full font-bold">منافيست أصلي</span>
            </div>

            <div class="p-3">
                <p class="text-sm font-semibold text-gray-800 mb-2">سكوتر ياماها زوما 125cc نظيف جداً بشرط الفحص.</p>
                <div class="text-xl font-black text-green-600 mb-2">850,000 د.ع</div>
            </div>

            <div class="px-2 py-1 flex justify-between items-center text-gray-600 border-t border-gray-100 text-xs font-semibold">
                <button onclick="checkAuthAndAction(() => togglePostLike(this))" class="flex-1 py-2 flex items-center justify-center space-x-1 space-x-reverse hover:bg-gray-50 rounded-lg btn-tap">
                    <i class="fa-regular fa-thumbs-up text-base"></i>
                    <span class="like-btn-text">إعجاب (12)</span>
                </button>
                
                <button onclick="toggleComments('comments-1')" class="flex-1 py-2 flex items-center justify-center space-x-1 space-x-reverse hover:bg-gray-50 rounded-lg btn-tap">
                    <i class="fa-regular fa-comment text-base"></i>
                    <span id="comments-count-1">تعليق (1)</span>
                </button>

                <button onclick="sharePost('سكوتر ياماها زوما 125cc', '850000')" class="flex-1 py-2 flex items-center justify-center space-x-1 space-x-reverse hover:bg-gray-50 rounded-lg btn-tap">
                    <i class="fa-solid fa-share text-base"></i>
                    <span>مشاركة</span>
                </button>

                <button onclick="openChat('علي العراقي', '07700000000')" class="flex-1 py-2 text-blue-600 flex items-center justify-center space-x-1 space-x-reverse hover:bg-blue-50 rounded-lg font-bold btn-tap">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                    <span>مراسلة</span>
                </button>
            </div>

            <!-- قسم التعليقات المدمج -->
            <div id="comments-1" class="bg-gray-50 p-3 border-t hidden text-xs space-y-3">
                <div id="comments-list-1" class="space-y-2">
                    <div class="bg-white p-2.5 rounded-xl shadow-sm border relative">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-gray-800">حسين البصري</span>
                            <span class="text-[10px] text-gray-400">منذ 30 دقيقة</span>
                        </div>
                        <p class="text-gray-700 mb-1.5">بي مجال السعر شراي ومستعجل؟</p>
                        
                        <!-- زر التفاعلات المحدود بإيموجي واحد -->
                        <div class="flex items-center gap-3 text-gray-500 text-[11px] pt-1 border-t border-gray-100">
                            <button onclick="selectEmoji(this, '👍')" class="hover:text-blue-600 btn-tap font-semibold">👍 <span class="emoji-cnt">0</span></button>
                            <button onclick="selectEmoji(this, '😂')" class="hover:text-yellow-600 btn-tap font-semibold">😂 <span class="emoji-cnt">0</span></button>
                            <button onclick="selectEmoji(this, '👎')" class="hover:text-red-600 btn-tap font-semibold">👎 <span class="emoji-cnt">0</span></button>
                        </div>
                    </div>
                </div>

                <!-- حقل إرسال تعليق جديد -->
                <div class="flex gap-2 pt-1">
                    <input id="comment-input-1" type="text" placeholder="اكتب تعليقك هنا..." class="flex-1 border rounded-full px-3 py-1.5 outline-none bg-white">
                    <button onclick="checkAuthAndAction(() => addNewComment(1))" class="bg-blue-600 text-white px-4 py-1.5 rounded-full font-bold btn-tap">نشر</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 3. نافذة الملف الشخصي للمستخدم/البائع -->
    <div id="profile-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl">
            <div class="bg-[#1877f2] text-white p-4 text-center relative">
                <button onclick="toggleModal('profile-modal')" class="absolute top-2 left-3 text-xl font-bold">&times;</button>
                <div class="w-16 h-16 bg-white/30 rounded-full mx-auto flex items-center justify-center text-2xl font-bold mb-1">👤</div>
                <h3 id="prof-name" class="font-bold text-lg">اسم المستخدم</h3>
                <p id="prof-city" class="text-xs text-blue-100">المحافظة</p>
            </div>
            <div class="p-4 grid grid-cols-2 gap-3 text-center border-b text-xs">
                <div class="bg-gray-50 p-3 rounded-xl">
                    <span class="block font-black text-lg text-blue-600" id="prof-active">0</span>
                    <span class="text-gray-500">معروضة حالياً</span>
                </div>
                <div class="bg-gray-50 p-3 rounded-xl">
                    <span class="block font-black text-lg text-green-600" id="prof-sold">0</span>
                    <span class="text-gray-500">تم بيعها</span>
                </div>
            </div>
            <div class="p-3 text-center">
                <button onclick="toggleModal('profile-modal')" class="bg-gray-200 text-gray-700 w-full py-2 rounded-xl text-xs font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- 4. نافذة إنشاء حساب وتسجيل الدخول بأيميل وباسورد -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 id="auth-title" class="font-bold text-base">تسجيل الدخول</h3>
                <button onclick="toggleModal('auth-modal')" class="text-lg font-bold">&times;</button>
            </div>
            
            <form onsubmit="handleAuth(event)" class="space-y-3 text-xs">
                <div id="name-field" class="hidden">
                    <label class="block font-bold mb-1">الاسم الكامل:</label>
                    <input id="user-fullname" type="text" placeholder="مثال: أحمد العراقي" class="w-full border rounded-lg p-2 outline-none">
                </div>
                <div>
                    <label class="block font-bold mb-1">البريد الإلكتروني:</label>
                    <input id="user-email" type="email" required placeholder="example@mail.com" class="w-full border rounded-lg p-2 outline-none">
                </div>
                <div>
                    <label class="block font-bold mb-1">كلمة المرور:</label>
                    <input id="user-pass" type="password" required placeholder="******" class="w-full border rounded-lg p-2 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl btn-tap text-sm">
                    تأكيد الدخول
                </button>
            </form>

            <div class="mt-3 text-center text-xs">
                <button onclick="toggleAuthMode()" id="switch-auth-btn" class="text-blue-600 font-bold hover:underline">
                    ليس لديك حساب؟ إنشاء حساب جديد
                </button>
            </div>
        </div>
    </div>

    <!-- البرمجة السلوكية المصلحة -->
    <script>
        const SUPABASE_URL = "https://lurzvtbvsglxswoiftao.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DDnpGIIa1_yMCTGPZjhQJA_oMg48DGt";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null; 
        let isSignupMode = false;

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function checkAuthAndAction(action) {
            if (!currentUser) {
                toggleModal('auth-modal');
            } else {
                action();
            }
        }

        // تبديل بين وضع الدخول ووضع إنشاء حساب جديد
        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('name-field').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = isSignupMode ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('switch-auth-btn').innerText = isSignupMode ? "لديك حساب بالفعل؟ تسجيل الدخول" : "ليس لديك حساب؟ إنشاء حساب جديد";
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const name = document.getElementById('user-fullname').value || "مستخدم جديد";
            currentUser = { name: name, email: email };
            alert(`أهلاً بك يا ${currentUser.name}! تم تسجيل الدخول بنجاح.`);
            toggleModal('auth-modal');
        }

        function openProfile(name, city, activeCount, soldCount) {
            document.getElementById('prof-name').innerText = name;
            document.getElementById('prof-city').innerText = city;
            document.getElementById('prof-active').innerText = activeCount;
            document.getElementById('prof-sold').innerText = soldCount;
            toggleModal('profile-modal');
        }

        // تفعيل الإعجاب على المنشور بشكل منضبط
        function togglePostLike(btn) {
            const isLiked = btn.classList.toggle('like-active');
            const textSpan = btn.querySelector('.like-btn-text');
            textSpan.innerText = isLiked ? "تم الإعجاب (13)" : "إعجاب (12)";
        }

        function toggleComments(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        // إضافة تعليق جديد فورياً بالصفحة
        function addNewComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input.value.trim()) return;

            const list = document.getElementById(`comments-list-${postId}`);
            const newCommentHtml = `
                <div class="bg-white p-2.5 rounded-xl shadow-sm border">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-gray-800">${currentUser.name}</span>
                        <span class="text-[10px] text-gray-400">الآن</span>
                    </div>
                    <p class="text-gray-700 mb-1.5">${input.value}</p>
                    <div class="flex items-center gap-3 text-gray-500 text-[11px] pt-1 border-t border-gray-100">
                        <button onclick="selectEmoji(this, '👍')" class="hover:text-blue-600 btn-tap font-semibold">👍 <span class="emoji-cnt">0</span></button>
                        <button onclick="selectEmoji(this, '😂')" class="hover:text-yellow-600 btn-tap font-semibold">😂 <span class="emoji-cnt">0</span></button>
                        <button onclick="selectEmoji(this, '👎')" class="hover:text-red-600 btn-tap font-semibold">👎 <span class="emoji-cnt">0</span></button>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', newCommentHtml);
            input.value = '';
        }

        // اختيار إيموجي مفرد فقط وحسابه مرة واحدة
        function selectEmoji(btn, emoji) {
            const span = btn.querySelector('.emoji-cnt');
            let count = parseInt(span.innerText);
            if (btn.classList.contains('text-blue-600')) {
                btn.classList.remove('text-blue-600');
                span.innerText = count - 1;
            } else {
                btn.classList.add('text-blue-600');
                span.innerText = count + 1;
            }
        }
    </script>
</body>
</html>
