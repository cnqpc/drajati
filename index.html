<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراجتي - سوق الدراجات الأول في العراق</title>
    <!-- خط القاهرة Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            font-family: 'Cairo', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(180deg, #f4f6f9 0%, #eef2f7 100%);
            min-height: 100vh;
        }

        .btn-tap { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .btn-tap:active { 
            transform: scale(0.93); 
        }
        
        .card-hover { 
            transition: transform 0.25s ease, box-shadow 0.25s ease; 
        }
        .card-hover:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.06);
        }

        .slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(-1.1rem);
        }

        @keyframes popBookmark {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-10deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .bookmark-pop {
            animation: popBookmark 0.35s ease-in-out;
        }

        .featured-bg {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px), radial-gradient(#334155 1px, #1e293b 1px);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            50% { transform: translateX(40%); }
            100% { transform: translateX(0%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 18s ease-in-out infinite alternate;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="text-gray-800 pb-12">

    <!-- 1. الهيدر العلوي الرئيسي -->
    <header class="bg-[#1877f2]/95 backdrop-blur-md text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-2xl mx-auto px-2.5 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-1.5 space-x-reverse cursor-pointer" onclick="hideAllViews(); showMainView();">
                <div class="w-8 h-8 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-lg flex items-center justify-center text-white text-base shadow-md border border-white/20 transform -rotate-3">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <span class="font-black text-lg tracking-tight text-white drop-shadow-sm">دراجتي</span>
            </div>

            <div class="flex items-center space-x-1.5 space-x-reverse">
                <button onclick="toggleQuickBrowse()" class="bg-white/15 hover:bg-white/25 text-white px-2 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 btn-tap" title="اتصفح بسرعة">
                    <i class="fa-solid fa-table-cells text-amber-300 text-[10px]"></i>
                    <span>اتصفح بسرعة</span>
                </button>

                <button onclick="checkAuthAndAction(() => toggleModal('add-post-modal'))" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 shadow-md shadow-green-500/20 btn-tap">
                    <i class="fa-solid fa-plus-circle text-[11px]"></i>
                    <span>اعرض دراجتك</span>
                </button>

                <button onclick="toggleModal('settings-modal')" class="w-7 h-7 bg-white/15 hover:bg-white/25 rounded-full flex items-center justify-center text-white text-xs btn-tap" title="الإعدادات">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <div onclick="showProfilePage()" class="w-7 h-7 bg-white/20 border border-white/40 rounded-full flex items-center justify-center cursor-pointer overflow-hidden shadow-sm btn-tap">
                    <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Guest" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </header>

    <!-- 2. الرئيسية وخلاصة الإعلانات -->
    <main id="main-view" class="max-w-2xl mx-auto pt-2.5 px-2">
        <div class="mb-2.5 flex gap-1.5 text-[11px]">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute right-2.5 top-2.5 text-gray-400 text-[10px]"></i>
                <input type="text" id="search-input" onkeyup="filterPosts()" placeholder="دور على نوع الدراجة، سكوتر..." class="w-full bg-white pl-2 pr-7 py-1.5 rounded-xl border border-gray-200/90 text-[11px] outline-none shadow-sm focus:border-blue-500 transition">
            </div>

            <button onclick="toggleModal('categories-modal')" class="bg-white border border-gray-200/90 hover:bg-gray-50 rounded-xl px-2.5 py-1.5 font-bold text-blue-600 outline-none shadow-sm flex items-center gap-1 btn-tap whitespace-nowrap">
                <i class="fa-solid fa-layer-group text-blue-500 text-[10px]"></i>
                <span id="selected-category-label">الكل</span>
                <i class="fa-solid fa-chevron-down text-[8px] text-gray-400"></i>
            </button>

            <button onclick="openCityPicker()" id="main-city-btn" class="bg-white border border-gray-200/90 rounded-xl px-2.5 py-1.5 font-bold text-gray-700 outline-none shadow-sm flex items-center gap-1 btn-tap whitespace-nowrap">
                <i class="fa-solid fa-location-dot text-blue-500 text-[10px]"></i>
                <span id="main-city-label">كل المحافظات</span>
            </button>
        </div>

        <!-- حاوية المنشورات التي سيتم جلبها مباشرة من Supabase -->
        <div id="posts-container" class="space-y-3">
            <p class="text-center text-xs text-gray-500 py-6">جاري تحميل المنشورات المباشرة...</p>
        </div>

        <!-- view اتصفح بسرعة -->
        <div id="quick-browse-view" class="hidden space-y-2.5">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border shadow-sm">
                <span class="font-black text-xs text-gray-800 flex items-center gap-1">
                    <i class="fa-solid fa-table-cells text-amber-500"></i> اتصفح بسرعة <span id="qb-page-num">1</span>
                </span>
                <button onclick="toggleQuickBrowse()" class="text-xs text-red-500 font-bold">إغلاق</button>
            </div>
            <div id="quick-browse-grid" class="grid grid-cols-2 gap-2"></div>
        </div>
    </main>

    <!-- 3. نافذة الفئات -->
    <div id="categories-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-xl p-3.5 shadow-2xl space-y-2.5 slide-up">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-xs text-gray-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group text-blue-600"></i> اختر الفئة
                </h3>
                <button onclick="toggleModal('categories-modal')" class="text-base font-bold text-gray-400 hover:text-gray-700">&times;</button>
            </div>

            <div id="main-categories-list" class="space-y-1.5 text-xs font-bold">
                <button onclick="selectCategory('الكل')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right flex items-center justify-between border border-gray-100 text-gray-700 transition">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-border-all text-blue-500"></i> كل الفئات</span>
                </button>
                <button onclick="selectCategory('دراجات نارية')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right flex items-center justify-between border border-gray-100 text-gray-700 transition">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-motorcycle text-amber-500"></i> الدراجات النارية</span>
                </button>
                <button onclick="selectCategory('دراجات هوائية')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right flex items-center justify-between border border-gray-100 text-gray-700 transition">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-bicycle text-green-500"></i> الدراجات الهوائية</span>
                </button>
                <button onclick="selectCategory('دراجات الشحن')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right flex items-center justify-between border border-gray-100 text-gray-700 transition">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-500"></i> دراجات الشحن</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 4. نافذة الإعدادات -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3.5 slide-up max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2.5">
                <h3 class="font-black text-sm flex items-center gap-2 text-gray-800">
                    <i class="fa-solid fa-gear text-blue-600"></i> إعدادات المنصة
                </h3>
                <button onclick="toggleModal('settings-modal')" class="text-lg font-bold text-gray-400 hover:text-gray-700">&times;</button>
            </div>
            <button onclick="toggleModal('settings-modal')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 rounded-xl text-xs btn-tap transition">
                إغلاق
            </button>
        </div>
    </div>

    <!-- 5. نافذة إضافة منشور جديد -->
    <div id="add-post-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3 overflow-y-auto">
        <div class="bg-white w-full max-w-sm rounded-xl p-4 shadow-2xl space-y-3 my-6 slide-up">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-sm text-gray-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-plus-circle text-emerald-600"></i> اعرض دراجتك
                </h3>
                <button onclick="toggleModal('add-post-modal')" class="text-lg font-bold text-gray-400 hover:text-gray-700">&times;</button>
            </div>

            <form onsubmit="handleAddPost(event)" class="space-y-2.5 text-xs font-bold">
                <div>
                    <label class="block mb-1 text-gray-700">عنوان الإعلان:</label>
                    <input type="text" id="post-title-input" required placeholder="مثال: دايون 2022 نظيفة" class="w-full border rounded-lg p-2 outline-none font-normal bg-gray-50 focus:bg-white focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block mb-1 text-gray-700">الفئة:</label>
                        <select id="post-category-input" required class="w-full border rounded-lg p-2 outline-none font-normal bg-gray-50 focus:bg-white">
                            <option value="دراجات نارية">دراجات نارية</option>
                            <option value="دراجات هوائية">دراجات هوائية</option>
                            <option value="دراجات الشحن">دراجات الشحن</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-1 text-gray-700">المحافظة:</label>
                        <select id="post-city-input" required class="w-full border rounded-lg p-2 outline-none font-normal bg-gray-50 focus:bg-white">
                            <option value="بغداد">بغداد</option>
                            <option value="البصرة">البصرة</option>
                            <option value="كربلاء">كربلاء</option>
                            <option value="النجف">النجف</option>
                            <option value="ديالى">ديالى</option>
                            <option value="واسط">واسط</option>
                            <option value="المثنى">المثنى</option>
                            <option value="ميسان">ميسان</option>
                            <option value="ذي قار">ذي قار</option>
                            <option value="كركوك">كركوك</option>
                            <option value="صلاح الدين">صلاح الدين</option>
                            <option value="الأنبار">الأنبار</option>
                            <option value="بابل">بابل</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-gray-700">السعر (د.ع):</label>
                    <input type="number" id="post-price-input" required placeholder="مثال: 750000" class="w-full border rounded-lg p-2 outline-none font-normal bg-gray-50 focus:bg-white">
                </div>

                <div>
                    <label class="block mb-1 text-gray-700">تفاصيل الإعلان:</label>
                    <textarea id="post-desc-input" rows="3" required placeholder="اشرح حالة الدراجة..." class="w-full border rounded-lg p-2 outline-none font-normal bg-gray-50 focus:bg-white"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow btn-tap transition">
                    انشر دراجتك الآن
                </button>
            </form>
        </div>
    </div>

    <!-- 6. البروفايل الشخصي -->
    <div id="profile-view" class="hidden min-h-screen bg-gray-100 pb-12">
        <header class="bg-white border-b sticky top-0 z-40 px-3 h-11 flex items-center justify-between shadow-sm">
            <button onclick="hideAllViews(); showMainView();" class="text-blue-600 font-bold text-xs flex items-center gap-1 btn-tap">
                <i class="fa-solid fa-arrow-right"></i>
                <span>رجوع للرئيسية</span>
            </button>
            <h3 class="font-bold text-xs text-gray-800">الملف الشخصي</h3>
            <div></div>
        </header>

        <div class="max-w-2xl mx-auto p-3 space-y-3">
            <div class="bg-white rounded-xl p-3 border shadow-sm text-center relative">
                <div class="w-16 h-16 rounded-full bg-gray-200 mx-auto mb-1.5 overflow-hidden border-2 border-blue-500 relative">
                    <img id="prof-view-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" class="w-full h-full object-cover">
                </div>
                <h2 id="prof-view-name" class="text-sm font-bold text-gray-800 mb-0.5">زائر</h2>
                
                <button id="auth-btn" onclick="loginWithGoogle()" class="mt-2 bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow btn-tap">
                    تسجيل الدخول عبر Google
                </button>
            </div>
        </div>
    </div>

    <!-- 7. نافذة اختيار المحافظات -->
    <div id="city-picker-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-xl p-3 shadow-2xl space-y-2 slide-up">
            <div class="flex justify-between items-center border-b pb-1.5">
                <h3 class="font-bold text-xs text-gray-800">اختر المحافظة</h3>
                <button onclick="toggleModal('city-picker-modal')" class="text-base font-bold text-gray-400 hover:text-gray-700">&times;</button>
            </div>
            <div class="grid grid-cols-2 gap-1.5 text-xs font-bold max-h-56 overflow-y-auto">
                <button onclick="selectCity('كل المحافظات')" class="p-2 bg-gray-50 rounded-lg text-right hover:bg-blue-50">كل المحافظات</button>
                <button onclick="selectCity('بغداد')" class="p-2 bg-gray-50 rounded-lg text-right hover:bg-blue-50">بغداد</button>
                <button onclick="selectCity('البصرة')" class="p-2 bg-gray-50 rounded-lg text-right hover:bg-blue-50">البصرة</button>
                <button onclick="selectCity('كربلاء')" class="p-2 bg-gray-50 rounded-lg text-right hover:bg-blue-50">كربلاء</button>
                <button onclick="selectCity('النجف')" class="p-2 bg-gray-50 rounded-lg text-right hover:bg-blue-50">النجف</button>
            </div>
        </div>
    </div>

    <!-- البرمجية والتزامن المباشر مع Supabase مع الحماية من الأخطاء -->
    <script>
        // ضع روابطك الخاصة بـ Supabase هنا
        const SUPABASE_URL = "https://lurzvtbvsglxswoiftao.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DDnpGIIa1_yMCTGPZjhQJA_oMg48DGt";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let selectedCity = 'كل المحافظات';
        let selectedCategory = 'الكل';

        window.addEventListener('DOMContentLoaded', async () => {
            initAuth();
            loadPosts();
            setupRealtimeSubscriptions();
        });

        // 1. إدارة جلسة المستخدم
        async function initAuth() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                updateUserUI(user);

                supabase.auth.onAuthStateChange((_event, session) => {
                    updateUserUI(session?.user || null);
                });
            } catch (err) {
                console.warn('تعذر جلب حالة المستخدم الحالية:', err);
            }
        }

        function updateUserUI(user) {
            if (user) {
                currentUser = {
                    id: user.id,
                    name: user.user_metadata.full_name || "مستخدم",
                    avatar: user.user_metadata.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.id}`
                };
                document.getElementById('header-avatar').src = currentUser.avatar;
                document.getElementById('prof-view-avatar').src = currentUser.avatar;
                document.getElementById('prof-view-name').innerText = currentUser.name;
                document.getElementById('auth-btn').innerText = "تسجيل الخروج";
                document.getElementById('auth-btn').onclick = logout;
            } else {
                currentUser = null;
                document.getElementById('header-avatar').src = "https://api.dicebear.com/7.x/bottts/svg?seed=Guest";
                document.getElementById('prof-view-avatar').src = "https://api.dicebear.com/7.x/bottts/svg?seed=Guest";
                document.getElementById('prof-view-name').innerText = "زائر";
                document.getElementById('auth-btn').innerText = "تسجيل الدخول عبر Google";
                document.getElementById('auth-btn').onclick = loginWithGoogle;
            }
        }

        async function loginWithGoogle() {
            await supabase.auth.signInWithOAuth({ provider: 'google' });
        }

        async function logout() {
            await supabase.auth.signOut();
        }

        // 2. جلب المنشورات والتعليقات بأمان
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            try {
                const { data: posts, error } = await supabase
                    .from('posts')
                    .select('*, comments(*)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p class="text-center text-xs text-gray-500 py-6">لا توجد منشورات حالياً. كن أول من يضيف إعلاناً!</p>';
                    return;
                }

                posts.forEach(post => {
                    container.appendChild(createPostCard(post));
                });
            } catch (err) {
                console.error('خطأ الاتصال بـ Supabase:', err);
                container.innerHTML = '<p class="text-center text-xs text-red-500 py-6">تعذر الاتصال بقاعدة البيانات. تأكد من إعداد المفتاح والجداول بشكل صحيح.</p>';
            }
        }

        function createPostCard(post) {
            const div = document.createElement('div');
            div.className = "post-card bg-white rounded-xl shadow-sm border border-gray-200/70 overflow-hidden card-hover";
            div.setAttribute('data-category', post.category || 'دراجات نارية');
            div.setAttribute('data-city', post.city_name || 'بغداد');
            div.id = `post-${post.id}`;
            
            const commentsHTML = (post.comments || []).map(c => `
                <div class="bg-white p-1.5 rounded border mb-1">
                    <span class="font-bold text-blue-600">${c.user_name}:</span>
                    <span class="text-gray-700">${c.text}</span>
                </div>
            `).join('');

            div.innerHTML = `
                <div class="p-3 flex items-center justify-between border-b border-gray-100">
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <img src="${post.user_avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=User'}" class="w-8 h-8 rounded-full border">
                        <div>
                            <h4 class="font-bold text-xs text-gray-900">${post.user_name || 'غير معروف'}</h4>
                            <p class="text-[10px] text-gray-400">${post.city_name || 'بغداد'}</p>
                        </div>
                    </div>
                </div>
                <div class="p-3 space-y-1.5">
                    <h3 class="post-title text-sm font-black text-gray-900">${post.title}</h3>
                    <p class="text-[11px] text-gray-600">${post.description || ''}</p>
                    <div class="text-base font-black text-green-600">${post.price || 0} د.ع</div>
                </div>
                <div class="px-2.5 py-2 border-t bg-gray-50 flex items-center justify-between text-[11px]">
                    <button onclick="toggleComments('${post.id}')" class="flex items-center gap-1 border bg-white px-2.5 py-1 rounded-full font-bold">
                        <i class="fa-regular fa-comment text-blue-500"></i>
                        <span>التعليقات</span>
                    </button>
                    <button onclick="sharePost('${post.title}')" class="flex items-center gap-1 border bg-white px-2.5 py-1 rounded-full font-bold text-green-600">
                        <i class="fa-solid fa-share-nodes"></i> مشاركة
                    </button>
                </div>
                <div id="comments-${post.id}" class="hidden bg-gray-50 p-2.5 border-t space-y-2 text-[11px]">
                    <div id="comments-list-${post.id}" class="space-y-1.5 max-h-40 overflow-y-auto">${commentsHTML}</div>
                    <div class="flex gap-1.5 pt-1">
                        <input type="text" id="input-${post.id}" placeholder="اكتب تعليقاً..." class="flex-1 bg-white border p-1.5 rounded-lg outline-none">
                        <button onclick="sendComment('${post.id}')" class="bg-blue-600 text-white px-3 rounded-lg font-bold btn-tap">إرسال</button>
                    </div>
                </div>
            `;
            return div;
        }

        // 3. الاستماع للتحديثات اللحظية
        function setupRealtimeSubscriptions() {
            try {
                supabase.channel('public:posts')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
                        const container = document.getElementById('posts-container');
                        if (container) {
                            container.insertBefore(createPostCard(payload.new), container.firstChild);
                        }
                    })
                    .subscribe();

                supabase.channel('public:comments')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, payload => {
                        const c = payload.new;
                        const list = document.getElementById(`comments-list-${c.post_id}`);
                        if (list) {
                            list.innerHTML += `
                                <div class="bg-white p-1.5 rounded border mb-1">
                                    <span class="font-bold text-blue-600">${c.user_name}:</span>
                                    <span class="text-gray-700">${c.text}</span>
                                </div>
                            `;
                        }
                    })
                    .subscribe();
            } catch (err) {
                console.warn('تعذر تفعيل التحديثات اللحظية:', err);
            }
        }

        // 4. تعليق جديد
        async function sendComment(postId) {
            if (!currentUser) return alert("يرجى تسجيل الدخول أولاً للتعليق!");
            const input = document.getElementById(`input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const { error } = await supabase.from('comments').insert([
                { post_id: postId, user_id: currentUser.id, user_name: currentUser.name, text: text }
            ]);

            if (error) alert("حدث خطأ أثناء إضافة التعليق!");
            else input.value = '';
        }

        // 5. إضافة إعلان جديد
        async function handleAddPost(e) {
            e.preventDefault();
            if (!currentUser) return alert("يرجى تسجيل الدخول أولاً لنشر إعلان!");

            const { error } = await supabase.from('posts').insert([
                {
                    title: document.getElementById('post-title-input').value,
                    category: document.getElementById('post-category-input').value,
                    city_name: document.getElementById('post-city-input').value,
                    price: document.getElementById('post-price-input').value,
                    description: document.getElementById('post-desc-input').value,
                    user_name: currentUser.name,
                    user_avatar: currentUser.avatar,
                    user_id: currentUser.id
                }
            ]);

            if (error) {
                alert("حدث خطأ أثناء إضافة الإعلان، يرجى المحاولة لاحقاً.");
            } else {
                toggleModal('add-post-modal');
                e.target.reset();
            }
        }

        // 6. أزرار وواجهات المستخدم
        function checkAuthAndAction(action) {
            if (!currentUser) {
                alert("يرجى تسجيل الدخول أولاً!");
                showProfilePage();
            } else { action(); }
        }

        function toggleModal(id) { 
            const modal = document.getElementById(id);
            if (modal) modal.classList.toggle('hidden'); 
        }

        function toggleComments(id) { 
            const commentsDiv = document.getElementById(`comments-${id}`);
            if (commentsDiv) commentsDiv.classList.toggle('hidden'); 
        }

        function hideAllViews() {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('profile-view').classList.add('hidden');
        }

        function showMainView() { 
            document.getElementById('main-view').classList.remove('hidden'); 
        }

        function showProfilePage() { 
            hideAllViews(); 
            document.getElementById('profile-view').classList.remove('hidden'); 
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            document.getElementById('selected-category-label').innerText = cat;
            toggleModal('categories-modal');
            filterPosts();
        }

        function openCityPicker() { toggleModal('city-picker-modal'); }

        function selectCity(city) {
            selectedCity = city;
            document.getElementById('main-city-label').innerText = city;
            toggleModal('city-picker-modal');
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const posts = document.querySelectorAll('.post-card');

            posts.forEach(post => {
                const title = post.querySelector('.post-title').innerText.toLowerCase();
                const postCat = post.getAttribute('data-category');
                const postCity = post.getAttribute('data-city');

                const matchesSearch = title.includes(query);
                const matchesCat = (selectedCategory === 'الكل') || (postCat === selectedCategory);
                const matchesCity = (selectedCity === 'كل المحافظات') || (postCity === selectedCity);

                if (matchesSearch && matchesCat && matchesCity) {
                    post.classList.remove('hidden');
                } else {
                    post.classList.add('hidden');
                }
            });
        }

        async function sharePost(title) {
            if (navigator.share) {
                await navigator.share({ title: 'دراجتي', text: title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط المنشور!');
            }
        }

        function toggleQuickBrowse() {
            const mainPosts = document.getElementById('posts-container');
            const qbView = document.getElementById('quick-browse-view');
            
            if (qbView.classList.contains('hidden')) {
                mainPosts.classList.add('hidden');
                qbView.classList.remove('hidden');
            } else {
                mainPosts.classList.remove('hidden');
                qbView.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
