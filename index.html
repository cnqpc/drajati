<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراجتي - سوق الدراجات في العراق</title>
    <!-- تضمين مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #1d3557;
            --light: #f1faee;
            --dark: #111;
            --gray: #6c757d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8f9fa; color: var(--dark); padding-bottom: 70px; }
        header { background: var(--secondary); color: white; padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-box input { flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; }
        .post-card { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .post-price { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
        .post-desc { margin-bottom: 0.5rem; color: #333; }
        .post-meta { display: flex; gap: 1rem; color: var(--gray); font-size: 0.85rem; margin-bottom: 0.5rem; }
        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 0.5rem; margin-top: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; background: #eee; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 0.75rem; border-top: 1px solid #ccc; }
        .nav-item { border: none; background: none; font-size: 0.9rem; color: var(--gray); cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>دراجتي 🏍️</h1>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن دراجة، محافظة، أو نوع..." onkeyup="filterPosts()">
        </div>

        <div id="postsList">
            <!-- جاري تحميل المنشورات من قاعدة البيانات -->
            <p style="text-align:center; color: var(--gray);">جاري تحميل المنشورات...</p>
        </div>
    </div>

    <!-- نافذة إضافة منشور جديد -->
    <div id="addPostModal" class="modal">
        <div class="modal-content">
            <h2>إضافة إعلان دراجة جديد</h2>
            <form onsubmit="handleAddPost(event)">
                <div class="form-group">
                    <label>عنوان الإعلان</label>
                    <input type="text" id="postTitle" required placeholder="مثال: إيراني 2022 نظيف">
                </div>
                <div class="form-group">
                    <label>السعر (بالدينار العراقي)</label>
                    <input type="number" id="postPrice" required placeholder="مثال: 750000">
                </div>
                <div class="form-group">
                    <label>المحافظة</label>
                    <select id="postGov" required>
                        <option value="بغداد">بغداد</option>
                        <option value="البصرة">البصرة</option>
                        <option value="النجف">النجف</option>
                        <option value="كربلاء">كربلاء</option>
                        <option value="أربيل">أربيل</option>
                        <option value="ذار قار">ذي قار</option>
                        <option value="بابل">بابل</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="postCategory" required>
                        <option value="سجاد / إيراني">سجاد / إيراني</option>
                        <option value="سكوتر">سكوتر</option>
                        <option value="بطة / ياباني">بطة / ياباني</option>
                        <option value="رياضي / دباب">رياضي / دباب</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف للاتصال</label>
                    <input type="tel" id="postPhone" required placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>الوصف التفصيلي</label>
                    <textarea id="postDesc" rows="3" placeholder="اذكر حالة المحرك، الأوراق، وغيرها..."></textarea>
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button type="button" class="btn" onclick="closeModal('addPostModal')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">نشر الإعلان</button>
                </div>
            </form>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <button class="nav-item" onclick="loadPosts()">🏠 الرئيسية</button>
        <button class="nav-item" onclick="openModal('addPostModal')">➕ إضافة إعلان</button>
    </div>

    <script>
        // 1. مفاتيح الربط الخاصة بـ Supabase
        const SUPABASE_URL = 'https://lurzvtbvsglxswoiftao.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1cnp2dGJ2c2dseHN3b2lmdGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzUzNjcsImV4cCI6MjEwMzgxMTM2N30.JrbwksyvYCF_3uSdrRFEtEMTt9CQLa0vGguCv9GHnB8';

        // إنشاء كائن الاتصال
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allPostsData = [];

        // 2. دالة جلب المنشورات من قاعدة البيانات وتحديث الشاشة
        async function loadPosts() {
            const listElement = document.getElementById('postsList');
            listElement.innerHTML = '<p style="text-align:center; color: var(--gray);">جاري تحميل المنشورات...</p>';

            try {
                const { data: posts, error } = await supabase
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allPostsData = posts || [];
                renderPosts(allPostsData);

            } catch (err) {
                console.error('خطأ في جلب البيانات:', err.message);
                listElement.innerHTML = '<p style="text-align:center; color:red;">تعذر تحميل المنشورات. يرجى محاولة التحديث.</p>';
            }
        }

        // 3. دالة رسم المنشورات في الصفحة
        function renderPosts(posts) {
            const listElement = document.getElementById('postsList');
            if (posts.length === 0) {
                listElement.innerHTML = '<p style="text-align:center; color: var(--gray);">لا توجد إعلانات حالياً. كن أول من يضيف إعلاناً!</p>';
                return;
            }

            listElement.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <h3>${escapeHtml(post.title)}</h3>
                        <span class="post-price">${Number(post.price).toLocaleString()} د.ع</span>
                    </div>
                    <div class="post-meta">
                        <span>📍 ${escapeHtml(post.governorate)}</span>
                        <span>🏷️ ${escapeHtml(post.category)}</span>
                    </div>
                    <p class="post-desc">${escapeHtml(post.description || 'لا يوجد وصف متاح.')}</p>
                    <div class="post-actions">
                        <span>📞 ${escapeHtml(post.phone || 'غير مدرج')}</span>
                        <button class="btn btn-primary" onclick="alert('رقم صاحب الإعلان: ' + '${escapeHtml(post.phone)}')">اتصال</button>
                    </div>
                </div>
            `).join('');
        }

        // 4. دالة إضافة منشور جديد إلى Supabase
        async function handleAddPost(event) {
            event.preventDefault();

            const title = document.getElementById('postTitle').value;
            const price = document.getElementById('postPrice').value;
            const governorate = document.getElementById('postGov').value;
            const category = document.getElementById('postCategory').value;
            const description = document.getElementById('postDesc').value;
            const phone = document.getElementById('postPhone').value;

            try {
                // ملاحظة: يُستخدم معرف مؤقت للمستخدم غير المسجل لتسهيل التجربة الآن
                const tempUserId = '00000000-0000-0000-0000-000000000000'; 

                const { data, error } = await supabase
                    .from('posts')
                    .insert([
                        {
                            user_id: tempUserId,
                            title: title,
                            price: parseFloat(price),
                            governorate: governorate,
                            category: category,
                            description: description,
                            phone: phone,
                            images: []
                        }
                    ]);

                if (error) throw error;

                alert('تم نشر الإعلان وحفظه في قاعدة البيانات بنجاح!');
                closeModal('addPostModal');
                event.target.reset();
                loadPosts();

            } catch (err) {
                console.error('خطأ أثناء النشر:', err.message);
                alert('حدث خطأ أثناء حفظ المنشور: ' + err.message);
            }
        }

        // 5. البحث والتصفية
        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPostsData.filter(p => 
                p.title.toLowerCase().includes(query) ||
                p.governorate.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query)
            );
            renderPosts(filtered);
        }

        // أدوات مساعدة
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // تشغيل التحميل التلقائي فور فتح الصفحة
        window.onload = loadPosts;
    </script>
</body>
</html>
