<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراجتي - سوق الدراجات الأول في العراق</title>
    <!-- خط القاهرة Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            font-family: 'Cairo', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(180deg, #f4f6f9 0%, #eef2f7 100%);
            min-height: 100vh;
        }
        .btn-tap { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-tap:active { transform: scale(0.93); }
        .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.06); }
        .slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .featured-bg {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px), radial-gradient(#334155 1px, #1e293b 1px);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }
        @keyframes marquee {
            0% { transform: translateX(0%); }
            50% { transform: translateX(40%); }
            100% { transform: translateX(0%); }
        }
        .animate-marquee { display: flex; width: max-content; animation: marquee 18s ease-in-out infinite alternate; }
        .animate-marquee:hover { animation-play-state: paused; }
    </style>
</head>
<body class="text-gray-800 pb-12">

    <!-- الهيدر العلوي -->
    <header class="bg-[#1877f2]/95 backdrop-blur-md text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-2xl mx-auto px-2.5 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-1.5 space-x-reverse cursor-pointer" onclick="hideAllViews(); showMainView();">
                <div class="w-8 h-8 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-lg flex items-center justify-center text-white text-base shadow-md border border-white/20 transform -rotate-3">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <span class="font-black text-lg tracking-tight text-white drop-shadow-sm">دراجتي</span>
            </div>

            <div class="flex items-center space-x-1.5 space-x-reverse">
                <button onclick="toggleQuickBrowse()" class="bg-white/15 hover:bg-white/25 text-white px-2 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 btn-tap">
                    <i class="fa-solid fa-table-cells text-amber-300 text-[10px]"></i>
                    <span>اتصفح بسرعة</span>
                </button>

                <button onclick="toggleModal('add-post-modal')" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 shadow-md shadow-green-500/20 btn-tap">
                    <i class="fa-solid fa-plus-circle text-[11px]"></i>
                    <span>اعرض دراجتك</span>
                </button>

                <button onclick="toggleModal('settings-modal')" class="w-7 h-7 bg-white/15 hover:bg-white/25 rounded-full flex items-center justify-center text-white text-xs btn-tap">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- الرئيسية -->
    <main id="main-view" class="max-w-2xl mx-auto pt-2.5 px-2">
        
        <!-- البحث والفلاتر -->
        <div class="mb-2.5 flex gap-1.5 text-[11px]">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute right-2.5 top-2.5 text-gray-400 text-[10px]"></i>
                <input type="text" id="search-input" onkeyup="filterPosts()" placeholder="ابحث عن نوع الدراجة، سكوتر..." class="w-full bg-white pl-2 pr-7 py-1.5 rounded-xl border border-gray-200/90 text-[11px] outline-none shadow-sm focus:border-blue-500 transition">
            </div>

            <button onclick="toggleModal('categories-modal')" class="bg-white border border-gray-200/90 rounded-xl px-2.5 py-1.5 font-bold text-blue-600 outline-none shadow-sm flex items-center gap-1 btn-tap whitespace-nowrap">
                <i class="fa-solid fa-layer-group text-blue-500 text-[10px]"></i>
                <span id="selected-category-label">الكل</span>
                <i class="fa-solid fa-chevron-down text-[8px] text-gray-400"></i>
            </button>

            <button onclick="openCityPicker()" class="bg-white border border-gray-200/90 rounded-xl px-2.5 py-1.5 font-bold text-gray-700 outline-none shadow-sm flex items-center gap-1 btn-tap whitespace-nowrap">
                <i class="fa-solid fa-location-dot text-blue-500 text-[10px]"></i>
                <span id="main-city-label">كل المحافظات</span>
            </button>
        </div>

        <!-- الإعلانات المميزة -->
        <div class="mb-3 rounded-xl p-2.5 featured-bg text-white shadow-md relative overflow-hidden">
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-[11px] font-black text-amber-400 flex items-center gap-1">
                    <i class="fa-solid fa-star text-amber-400 animate-pulse text-[10px]"></i> إعلانات مميزة حية
                </span>
            </div>
            <div class="overflow-hidden w-full">
                <div id="featured-posts-container" class="animate-marquee flex gap-2.5"></div>
            </div>
        </div>

        <!-- قائمة المنشورات الحية -->
        <div id="posts-container" class="space-y-3">
            <div class="text-center py-6 text-gray-500 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-lg mb-2"></i>
                <p>جاري مزامنة الإعلانات الحية من Supabase...</p>
            </div>
        </div>

        <!-- اتصفح بسرعة -->
        <div id="quick-browse-view" class="hidden space-y-2.5">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border shadow-sm">
                <span class="font-black text-xs text-gray-800 flex items-center gap-1">
                    <i class="fa-solid fa-table-cells text-amber-500"></i> التصفح السريع
                </span>
                <button onclick="toggleQuickBrowse()" class="text-xs text-red-500 font-bold">إغلاق</button>
            </div>
            <div id="quick-browse-grid" class="grid grid-cols-2 gap-2"></div>
        </div>
    </main>

    <!-- نافذة إضافة إعلان -->
    <div id="add-post-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-lg rounded-2xl p-4 shadow-2xl space-y-3 slide-up max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-sm text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-green-600"></i> نشر إعلان جديد حقيقي
                </h3>
                <button onclick="toggleModal('add-post-modal')" class="text-lg font-bold text-gray-400">&times;</button>
            </div>

            <form id="add-post-form" onsubmit="handleCreatePost(event)" class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-gray-700 block mb-1">عنوان الإعلان</label>
                    <input type="text" id="post-title" required placeholder="مثال: سكوتر ياماها 2022 نظيف جداً" class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">السعر</label>
                        <input type="text" id="post-price" required placeholder="مثال: $850 أو 1,200,000 د.ع" class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">الفئة</label>
                        <select id="post-category" required class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500">
                            <option value="دراجات نارية">دراجات نارية</option>
                            <option value="دراجات هوائية">دراجات هوائية</option>
                            <option value="دراجات الشحن">دراجات الشحن</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">المحافظة</label>
                        <select id="post-city" required class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500">
                            <option value="بغداد">بغداد</option>
                            <option value="البصرة">البصرة</option>
                            <option value="أربيل">أربيل</option>
                            <option value="النجف">النجف</option>
                            <option value="كربلاء">كربلاء</option>
                            <option value="كركوك">كركوك</option>
                            <option value="الموصل">الموصل</option>
                            <option value="بابل">بابل</option>
                            <option value="ذي قار">ذي قار</option>
                            <option value="سليمانية">سليمانية</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">رقم الواتساب للتواصل</label>
                        <input type="tel" id="post-phone" required placeholder="07700000000" class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="font-bold text-gray-700 block mb-1">تفاصيل الدراجة</label>
                    <textarea id="post-desc" rows="3" required placeholder="اكتب تفاصيل المحرك، السند، الحالة..." class="w-full bg-gray-50 border rounded-lg p-2 outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="font-bold text-gray-700 block mb-1">صور الدراجة (تضغط تلقائياً إلى HD 720p)</label>
                    <input type="file" id="post-images" accept="image/*" multiple onchange="previewAndCompressImages(event)" class="w-full bg-gray-50 border rounded-lg p-1.5 outline-none text-xs">
                    <div id="images-preview" class="flex gap-2 mt-2 overflow-x-auto py-1"></div>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="post-featured" class="w-4 h-4 text-amber-500 rounded">
                    <label for="post-featured" class="font-bold text-amber-600">تمييز الإعلان في الشريط العلوي</label>
                </div>
                <button type="submit" id="submit-post-btn" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-2.5 rounded-xl btn-tap transition shadow-md">
                    نشر الإعلان مباشرة الآن
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة المحافظات -->
    <div id="city-picker-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-xl p-3.5 shadow-2xl space-y-2.5 slide-up max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-xs text-gray-800">اختر المحافظة</h3>
                <button onclick="toggleModal('city-picker-modal')" class="text-base font-bold text-gray-400">&times;</button>
            </div>
            <div id="cities-list-container" class="space-y-1 text-xs font-bold"></div>
        </div>
    </div>

    <!-- نافذة الفئات -->
    <div id="categories-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-xl p-3.5 shadow-2xl space-y-2.5 slide-up">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-xs text-gray-800">اختر الفئة</h3>
                <button onclick="toggleModal('categories-modal')" class="text-base font-bold text-gray-400">&times;</button>
            </div>
            <div class="space-y-1.5 text-xs font-bold">
                <button onclick="selectCategory('الكل')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right">كل الفئات</button>
                <button onclick="selectCategory('دراجات نارية')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right">دراجات نارية</button>
                <button onclick="selectCategory('دراجات هوائية')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right">دراجات هوائية</button>
                <button onclick="selectCategory('دراجات الشحن')" class="w-full p-2.5 bg-gray-50 hover:bg-blue-50 rounded-lg text-right">دراجات الشحن</button>
            </div>
        </div>
    </div>

    <!-- الإعدادات -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3.5 slide-up">
            <div class="flex justify-between items-center border-b pb-2.5">
                <h3 class="font-black text-sm text-gray-800">الإعدادات</h3>
                <button onclick="toggleModal('settings-modal')" class="text-lg font-bold text-gray-400">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div class="p-2.5 bg-gray-50 rounded-xl border flex items-center justify-between">
                    <span>وضع ضغط الصور تلقائياً (Max 720p)</span>
                    <span class="text-emerald-600 font-bold">مفعل</span>
                </div>
            </div>
            <button onclick="toggleModal('settings-modal')" class="w-full bg-gray-800 text-white font-bold py-2 rounded-xl text-xs">إغلاق</button>
        </div>
    </div>

    <!-- كود التشغيل والربط الحقيقي بـ Supabase -->
    <script>
        // إعدادات الربط الحقيقي بقاعدة البيانات
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_URL.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let compressedImagesBase64 = [];
        let currentCategoryFilter = 'الكل';
        let currentCityFilter = 'كل المحافظات';
        const IRAQ_CITIES = ['كل المحافظات', 'بغداد', 'البصرة', 'أربيل', 'النجف', 'كربلاء', 'كركوك', 'الموصل', 'بابل', 'ذي قار', 'سليمانية', 'أنبار', 'ديالى', 'قادسية', 'ميسان', 'مثنى', 'واسط', 'صلاح الدين', 'دهوك'];

        document.addEventListener('DOMContentLoaded', () => {
            initCityPickerList();
            loadPostsFromSupabase();
        });

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function hideAllViews() {
            document.getElementById('main-view').classList.add('hidden');
        }

        function showMainView() {
            document.getElementById('main-view').classList.remove('hidden');
        }

        function openCityPicker() {
            toggleModal('city-picker-modal');
        }

        function initCityPickerList() {
            const container = document.getElementById('cities-list-container');
            if(!container) return;
            container.innerHTML = IRAQ_CITIES.map(city => `
                <button onclick="selectCity('${city}')" class="w-full p-2 bg-gray-50 hover:bg-blue-50 rounded-lg text-right flex items-center justify-between">
                    <span>${city}</span>
                    ${city === currentCityFilter ? '<i class="fa-solid fa-check text-blue-600"></i>' : ''}
                </button>
            `).join('');
        }

        function selectCity(city) {
            currentCityFilter = city;
            document.getElementById('main-city-label').innerText = city;
            toggleModal('city-picker-modal');
            initCityPickerList();
            loadPostsFromSupabase();
        }

        function selectCategory(cat) {
            currentCategoryFilter = cat;
            document.getElementById('selected-category-label').innerText = cat;
            toggleModal('categories-modal');
            loadPostsFromSupabase();
        }

        // ضغط وتصغير الصور لـ 720p تلقائياً
        async function previewAndCompressImages(event) {
            const files = event.target.files;
            const previewContainer = document.getElementById('images-preview');
            previewContainer.innerHTML = '';
            compressedImagesBase64 = [];

            for (let file of files) {
                const resizedBase64 = await resizeImageTo720p(file);
                compressedImagesBase64.push(resizedBase64);

                const img = document.createElement('img');
                img.src = resizedBase64;
                img.className = 'w-16 h-16 object-cover rounded-lg border shadow-sm';
                previewContainer.appendChild(img);
            }
        }

        function resizeImageTo720p(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxHeight = 720;

                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // جلب البيانات الحية من Supabase
        async function loadPostsFromSupabase() {
            let query = supabaseClient.from('posts').select('*').order('created_at', { ascending: false });

            if (currentCategoryFilter !== 'الكل') {
                query = query.eq('category', currentCategoryFilter);
            }
            if (currentCityFilter !== 'كل المحافظات') {
                query = query.eq('city', currentCityFilter);
            }

            const { data: posts, error } = await query;
            if (error) {
                console.error("خطأ في جلب البيانات:", error.message);
                return;
            }

            renderPosts(posts);
            renderFeaturedPosts(posts.filter(p => p.is_featured));
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs font-bold">لا توجد إعلانات مطابقة حالياً في قاعدة البيانات</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="bg-white rounded-2xl p-3 border shadow-sm card-hover space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-gray-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-user-circle text-blue-500"></i> معلن حي
                        </span>
                        <span class="text-[10px] text-gray-400"><i class="fa-solid fa-location-dot text-red-500"></i> ${post.city}</span>
                    </div>

                    <div class="flex gap-2.5">
                        <img src="${(post.images && post.images[0]) ? post.images[0] : 'https://via.placeholder.com/150'}" class="w-24 h-24 object-cover rounded-xl border flex-shrink-0">
                        <div class="flex-1 space-y-1">
                            <h4 class="font-black text-xs text-gray-800 line-clamp-1">${post.title}</h4>
                            <p class="text-amber-600 font-extrabold text-xs">${post.price}</p>
                            <p class="text-[11px] text-gray-500 line-clamp-2">${post.description}</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-1 border-t text-xs">
                        <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md font-bold text-[10px]">${post.category}</span>
                        <a href="https://wa.me/${post.phone}" target="_blank" class="bg-emerald-500 text-white px-3 py-1 rounded-lg font-bold text-[11px] flex items-center gap-1 btn-tap shadow-sm">
                            <i class="fa-brands fa-whatsapp"></i> تواصل عبر الواتساب (${post.phone})
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function renderFeaturedPosts(featured) {
            const container = document.getElementById('featured-posts-container');
            if (!featured || featured.length === 0) {
                container.innerHTML = `<span class="text-[10px] text-gray-400 py-2">لا توجد إعلانات مميزة حالياً</span>`;
                return;
            }

            container.innerHTML = featured.map(post => `
                <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-1.5 w-36 flex-shrink-0 space-y-1">
                    <img src="${(post.images && post.images[0]) ? post.images[0] : 'https://via.placeholder.com/150'}" class="w-full h-16 object-cover rounded-lg">
                    <p class="font-bold text-[10px] text-white line-clamp-1">${post.title}</p>
                    <p class="text-amber-400 font-black text-[10px]">${post.price}</p>
                </div>
            `).join('');
        }

        // إرسال البيانات بشكل حقيقي وفعلي لـ Supabase
        async function handleCreatePost(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-post-btn');
            btn.disabled = true;
            btn.innerText = "جاري النشر الحي في قاعدة البيانات...";

            const newPost = {
                title: document.getElementById('post-title').value,
                price: document.getElementById('post-price').value,
                category: document.getElementById('post-category').value,
                city: document.getElementById('post-city').value,
                phone: document.getElementById('post-phone').value,
                description: document.getElementById('post-desc').value,
                images: compressedImagesBase64,
                is_featured: document.getElementById('post-featured').checked,
                created_at: new Date()
            };

            const { error } = await supabaseClient.from('posts').insert([newPost]);
            
            if (error) {
                alert("حدث خطأ أثناء النشر: " + error.message);
            } else {
                alert("تم نشر إعلانك ورقمك وصورك بنجاح مباشر وتظهر الآن لكل المستخدمين!");
                toggleModal('add-post-modal');
                document.getElementById('add-post-form').reset();
                document.getElementById('images-preview').innerHTML = '';
                compressedImagesBase64 = [];
                loadPostsFromSupabase();
            }

            btn.disabled = false;
            btn.innerText = "نشر الإعلان مباشرة الآن";
        }

        function filterPosts() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            // تصفية محلية سريعة بناءً على النص المدخل
            const postsContainer = document.getElementById('posts-container');
